# =========================================================
# Configuracion del entorno de desarrollo - Sistema Inventario
# =========================================================

# Nombre de la aplicacion
spring.application.name=sistema-inventario

# Puerto del servidor embebido (Tomcat)
server.port=8080

# ---------------------------------------------------------
# Conexion a base de datos MySQL 
# ---------------------------------------------------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# Configuracion de JPA / Hibernate
# ---------------------------------------------------------
# 'update': Hibernate crea/ajusta las tablas segun las entidades
# sin borrar los datos existentes. Ideal para desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---------------------------------------------------------
# Manejo de errores: 
# ---------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
