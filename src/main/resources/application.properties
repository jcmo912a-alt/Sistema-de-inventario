# =========================================================
# Configuracion - Sistema Inventario (local y nube)
# =========================================================
spring.application.name=sistema-inventario

# Render asigna el puerto en la variable PORT; en local usa 8080
server.port=${PORT:8080}

# ---------------------------------------------------------
# Base de datos MySQL
# En local usa los valores por defecto; en la nube se definen
# las variables DB_URL, DB_USERNAME y DB_PASSWORD
# ---------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ---------------------------------------------------------
# Manejo de errores
# ---------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always